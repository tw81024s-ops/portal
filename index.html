<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e6007e">
<title>專案入口 · Project Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff0f7;
  --bg2:#ffffff;
  --card:#ffffff;
  --line:#ffd0e6;
  --ink:#3d1030;
  --muted:#a86a8e;
  --accent:#e6007e;
  --accent2:#ff4fa8;
  --danger:#e2654d;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}        /* 字級基準 */
html.fs-l{font-size:18.5px}
html.fs-xl{font-size:22px}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC",system-ui,sans-serif;
  font-size:1rem;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}
/* soft pink atmosphere */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(900px 520px at 82% -10%, rgba(255,79,168,.30), transparent 60%),
    radial-gradient(720px 600px at -12% 112%, rgba(230,0,126,.16), transparent 55%),
    var(--bg);
}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 100px}

/* ---------- header ---------- */
header{padding:54px 0 30px;border-bottom:2px solid var(--line)}
.kicker{font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:30px;height:2px;background:var(--accent);border-radius:2px}
h1{
  font-family:"Baloo 2","Noto Sans TC",sans-serif;
  font-weight:800;
  font-size:clamp(40px,7.5vw,76px);
  line-height:1;
  letter-spacing:-.01em;
  margin:14px 0 6px;
  color:var(--ink);
}
h1 em{font-style:normal;color:var(--accent)}
.sub{color:var(--muted);font-size:.9rem;max-width:520px;line-height:1.7;margin-top:12px}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:28px 0 22px}
.search{flex:1;min-width:220px;position:relative}
.search input{
  width:100%;background:var(--card);border:2px solid var(--line);color:var(--ink);
  padding:12px 16px 12px 42px;border-radius:999px;font-family:inherit;font-size:.85rem;outline:none;transition:.2s;
}
.search input:focus{border-color:var(--accent)}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--accent)}
.btn{
  background:var(--card);border:2px solid var(--line);color:var(--accent);
  padding:11px 18px;border-radius:999px;font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;
  transition:.2s;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);background:#fff5fa;transform:translateY(-1px)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.solid:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn.ghost.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- font-size switch ---------- */
.fontsw{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.fontsw button{border:0;background:transparent;color:var(--muted);font-family:inherit;cursor:pointer;padding:9px 13px;font-weight:700;transition:.18s;line-height:1}
.fontsw button:nth-child(1){font-size:.78rem}
.fontsw button:nth-child(2){font-size:.92rem}
.fontsw button:nth-child(3){font-size:1.06rem}
.fontsw button.active{background:var(--accent);color:#fff}
.fontsw button:hover:not(.active){background:#fff5fa;color:var(--accent)}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.chip{
  background:var(--card);border:2px solid var(--line);color:var(--muted);
  padding:7px 16px;border-radius:999px;font-family:inherit;font-size:.78rem;font-weight:500;cursor:pointer;transition:.18s;
}
.chip:hover{color:var(--accent);border-color:var(--accent)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:20px}
.card{
  background:var(--card);border:2px solid var(--line);border-radius:var(--radius);
  overflow:hidden;position:relative;display:flex;flex-direction:column;
  transition:transform .28s cubic-bezier(.2,.7,.3,1),border-color .28s,box-shadow .28s;
  opacity:0;transform:translateY(14px);animation:rise .55s forwards;
  box-shadow:0 10px 30px -22px rgba(230,0,126,.5);
}
@keyframes rise{to{opacity:1;transform:none}}
.card:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 24px 50px -26px rgba(230,0,126,.6)}
.thumb{aspect-ratio:16/10;overflow:hidden;position:relative;background:var(--bg)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s;z-index:1}
.card:hover .thumb img{transform:scale(1.05)}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.thumb .ph svg{width:38%;height:38%;opacity:.95;filter:drop-shadow(0 3px 8px rgba(0,0,0,.18))}
.idx{position:absolute;top:12px;left:12px;z-index:2;font-size:.7rem;font-weight:700;color:var(--accent);background:rgba(255,255,255,.9);backdrop-filter:blur(4px);padding:3px 10px;border-radius:999px}
.body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.tag{font-size:.7rem;letter-spacing:.06em;font-weight:700;color:var(--accent)}
.card h3{font-family:"Baloo 2","Noto Sans TC",sans-serif;font-weight:700;font-size:1.35rem;line-height:1.2}
.card p{color:var(--muted);font-size:.82rem;line-height:1.65;flex:1}
.go{display:inline-flex;align-items:center;gap:7px;color:var(--accent);font-size:.8rem;font-weight:700;text-decoration:none;margin-top:4px;transition:gap .2s}
.go:hover{gap:12px}
.card a.cover{position:absolute;inset:0;z-index:1}
.editbar{position:absolute;top:12px;right:12px;display:none;gap:7px;z-index:3}
body.editing .editbar{display:flex}
.iconbtn{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(4px);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s}
.iconbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.iconbtn.del:hover{background:var(--danger);border-color:var(--danger);color:#fff}
body.editing .card a.cover{pointer-events:none}

/* add card */
.addcard{display:none;align-items:center;justify-content:center;min-height:230px;border:2.5px dashed var(--line);border-radius:var(--radius);color:var(--accent);cursor:pointer;flex-direction:column;gap:10px;transition:.22s;background:rgba(255,255,255,.5)}
body.editing .addcard{display:flex}
.addcard:hover{border-color:var(--accent);background:#fff5fa}
.addcard .plus{font-size:2.2rem;font-family:"Baloo 2",sans-serif;font-weight:800}

.empty{text-align:center;color:var(--muted);padding:70px 0;font-size:.85rem;grid-column:1/-1}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(61,16,48,.45);backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
.overlay.open{display:flex}
.modal{background:var(--bg2);border:2px solid var(--line);border-radius:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:30px;box-shadow:0 30px 60px -20px rgba(230,0,126,.4)}
.modal h2{font-family:"Baloo 2","Noto Sans TC",sans-serif;font-size:1.7rem;font-weight:800;margin-bottom:22px;color:var(--accent)}
.field{margin-bottom:16px}
.field label{display:block;font-size:.72rem;letter-spacing:.04em;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;background:#fff;border:2px solid var(--line);color:var(--ink);padding:11px 13px;border-radius:12px;font-family:inherit;font-size:.85rem;outline:none;transition:.2s}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:64px}
.imgrow{display:flex;gap:10px;align-items:center}
.imgrow input{flex:1}
.preview{width:100%;aspect-ratio:16/10;border-radius:12px;border:2px solid var(--line);object-fit:cover;margin-top:10px;display:none;background:#fff}
.modalbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.hint{font-size:.72rem;color:var(--muted);margin-top:6px;line-height:1.55}
.iconpick{display:flex;flex-wrap:wrap;gap:8px}
.iconpick button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.16s;padding:0}
.iconpick button svg{width:22px;height:22px}
.iconpick button:hover{border-color:var(--accent);background:#fff5fa}
.iconpick button.active{border-color:var(--accent);background:var(--accent)}
footer{margin-top:56px;padding-top:22px;border-top:2px solid var(--line);color:var(--muted);font-size:.74rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
#status[data-kind="ok"]{color:var(--accent);font-weight:700}
#status[data-kind="warn"]{color:var(--danger);font-weight:700}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Project Index</div>
    <h1>專案<em>入口</em></h1>
    <p class="sub">所有作品的集散地。點開任一張卡片即可前往該專案。開啟「編輯模式」可隨時新增、修改或刪除。</p>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="搜尋專案…">
    </div>
    <div class="fontsw" id="fontsw" title="字體大小">
      <button data-fs="" class="active">標準</button>
      <button data-fs="l">放大</button>
      <button data-fs="xl">特大</button>
    </div>
    <button class="btn ghost" id="editToggle">✎ 編輯模式</button>
    <button class="btn" id="exportBtn">↓ 匯出</button>
    <button class="btn" id="importBtn">↑ 匯入</button>
    <button class="btn" id="logoutBtn" style="display:none">⎋ 清除密碼</button>
    <input type="file" id="importFile" accept="application/json">
  </div>

  <div class="filters" id="filters"></div>

  <div class="grid" id="grid"></div>

  <footer>
    <span id="count">—</span>
    <span id="status"></span>
  </footer>
</div>

<!-- modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">新增專案</h2>
    <div class="field">
      <label>專案名稱</label>
      <input id="f-title" type="text" placeholder="例如：互動式資料儀表板">
    </div>
    <div class="field">
      <label>連結網址</label>
      <input id="f-url" type="text" placeholder="https://...">
    </div>
    <div class="field">
      <label>分類標籤</label>
      <input id="f-tag" type="text" placeholder="例如：網頁應用、視覺化、實驗">
    </div>
    <div class="field">
      <label>簡短描述</label>
      <textarea id="f-desc" placeholder="一兩句話介紹這個專案在做什麼"></textarea>
    </div>
    <div class="field">
      <label>圖片</label>
      <div class="imgrow">
        <input id="f-img" type="text" placeholder="貼上圖片網址，或 →">
        <button class="btn" id="uploadBtn">上傳檔案</button>
        <input type="file" id="imgFile" accept="image/*">
      </div>
      <img class="preview" id="preview">
      <p class="hint">建議貼圖片網址（或把圖檔放進 GitHub repo 再填路徑）。共用版的資料存在 Google 試算表，直接上傳的大圖可能超過儲存格上限，圖多時請改用網址。</p>
    </div>
    <div class="field">
      <label>圖示（沒放圖片時，卡片會顯示這個 icon）</label>
      <div class="iconpick" id="iconpick"></div>
    </div>
    <div class="modalbtns">
      <button class="btn" id="cancelBtn">取消</button>
      <button class="btn solid" id="saveBtn">儲存</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   專案資料 — 也可直接在這裡手動加，格式如下
   { title, url, tag, desc, image, icon }
   icon 可填：truck shield scan clipboard chart car globe pin wrench box apps doc
   留空會依標題/分類自動挑選
   ============================================================ */
const SEED = [
  { title:"當配日結看板", url:"https://tw81024s-ops.github.io/delivery-board/", tag:"物流看板", desc:"TMS 當配日結概況。把日結報表 .xlsx 拖入即在本機運算，呈現各站別配結率與滯留明細，可匯出 Excel。", image:"", icon:"truck" },
  { title:"駕駛行為安全管理看板", url:"https://tw81024s-ops.github.io/eLocation/", tag:"安全看板", desc:"富昇物流車隊安全主控台。匯入駕駛行為報表，分析超速、急轉彎、急加減速，並排名站所與人員績效。", image:"", icon:"shield" },
  { title:"momo 包裹刷讀工具", url:"https://amazing-vacherin-9bbe37.netlify.app/", tag:"行動工具", desc:"掃描或手動輸入包裹條碼，指定發貨所後一鍵匯出 Excel，支援相機掃碼，適合手機操作。", image:"", icon:"scan" },
  { title:"車輛點檢表", url:"https://eclectic-rolypoly-0fe2ea.netlify.app/", tag:"表單工具", desc:"富昇物流車輛月檢表，三車型整合。可在車輛照片上點選標記異常位置，填完列印或存成 PDF。", image:"", icon:"clipboard" },
  { title:"Google 應用（待命名）", url:"https://script.google.com/macros/s/AKfycbyaO3PSGluwaw2wwmYj8x4ScAIhJUUXOtDeWTRLSRCgfRPIpZsGEdScrhf4yv9hEss2/exec", tag:"工具", desc:"Google Apps Script 應用，請進編輯模式補上名稱與說明。", image:"", icon:"globe" },
  { title:"Google 應用（待命名）", url:"https://script.google.com/macros/s/AKfycbxXSX8hczwbj0ECjnqEbwwEX4t1lJ9ya9MqBdhYactrL03pYMlYNTajXAxcSe72c9VX1w/exec", tag:"工具", desc:"Google Apps Script 應用，請進編輯模式補上名稱與說明。", image:"", icon:"globe" }
];

/* ---- 圖示庫（白色線條，畫在彩色底上）---- */
const ICONS = {
  truck:    '<path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.7"/><circle cx="17.5" cy="18" r="1.7"/>',
  shield:   '<path d="M12 3l7 3v5c0 4.6-3 7.7-7 9-4-1.3-7-4.4-7-9V6z"/><path d="m9 12 2 2 4-4"/>',
  scan:     '<path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8"/><path d="M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8"/><path d="M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16"/><path d="M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="M7.5 8.5v7M10.5 8.5v7M13.5 8.5v7M16.5 8.5v7"/>',
  clipboard:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9.5 4V3h5v1"/><path d="m9 13 2 2 4-4"/>',
  chart:    '<path d="M4 4v16h16"/><rect x="7" y="11" width="3" height="6" rx="1"/><rect x="12" y="7" width="3" height="10" rx="1"/><rect x="17" y="13" width="3" height="4" rx="1"/>',
  car:      '<path d="M5 13l1.6-4.6A2 2 0 0 1 8.5 7h7a2 2 0 0 1 1.9 1.4L19 13"/><path d="M4 13h16v4H4z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/>',
  globe:    '<circle cx="12" cy="12" r="8"/><path d="M4 12h16"/><path d="M12 4c2.6 2.6 2.6 13 0 16"/><path d="M12 4c-2.6 2.6-2.6 13 0 16"/>',
  pin:      '<path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>',
  wrench:   '<path d="M15.5 6.5a4 4 0 0 0-5.3 5.1l-6 6 2.2 2.2 6-6a4 4 0 0 0 5.1-5.3l-2.7 2.7-2-2z"/>',
  box:      '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5"/><path d="M12 12v9"/>',
  apps:     '<rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/>',
  doc:      '<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9.5 12h5M9.5 16h5"/>'
};
const ICON_ORDER = ["truck","shield","scan","clipboard","chart","car","globe","pin","wrench","box","doc","apps"];

function inferIcon(p){
  const s=((p.tag||"")+(p.title||"")+(p.desc||"")).toLowerCase();
  const has=arr=>arr.some(k=>s.includes(k));
  if(has(["掃","刷讀","條碼","包裹","scan","barcode"])) return "scan";
  if(has(["點檢","檢查","表單","點檢表","inspection","checklist","form"])) return "clipboard";
  if(has(["安全","駕駛","事故","safety","fleet"])) return "shield";
  if(has(["看板","報表","統計","分析","儀表","dashboard","chart","analytics","kpi"])) return "chart";
  if(has(["配送","物流","當配","轉運","出貨","delivery","logistics","truck"])) return "truck";
  if(has(["位置","地圖","定位","location","map","gps"])) return "pin";
  if(has(["車","vehicle","car"])) return "car";
  if(has(["工具","tool","wrench","維修"])) return "wrench";
  if(has(["google","script","應用","網站","web","site"])) return "globe";
  if(has(["文件","報告","表單","doc","report"])) return "doc";
  return "apps";
}
function iconSVG(key){
  const inner=ICONS[key]||ICONS.apps;
  return `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}
function iconFor(p){ return (p.icon && ICONS[p.icon]) ? p.icon : inferIcon(p); }

const PALETTES = [
  ["#e8a23d","#ff7a45"],["#5ec5b6","#2f8f86"],["#9b7ede","#6d4fb0"],
  ["#e2654d","#b03a2e"],["#6fa8dc","#3d6ea5"],["#d4c44a","#9a8a1f"]
];

/* ============================================================
   後端設定 — 部署前改成你的 Apps Script 網址
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbydmd4RNIwjwV-USa2S-1E_NSCHlVDjJFeCfpjCbXmDUAe_9qIHy7mO2d9Ra40G73TLHQ/exec";   // ★ 你的 Apps Script /exec 網址
const PW_KEY    = "portal_edit_pw";     // 編輯密碼只存在編輯者自己的瀏覽器
const CACHE_KEY = "portal_cache";

let state = [];
let editing = false;
let activeTag = "全部";
let query = "";
let editIndex = null;
let pendingImg = "";

const $ = id => document.getElementById(id);
const grid=$("grid"), filters=$("filters"), overlay=$("overlay");

function getPw(){ try{return localStorage.getItem(PW_KEY)||"";}catch(e){return "";} }
function setPw(p){ try{ p?localStorage.setItem(PW_KEY,p):localStorage.removeItem(PW_KEY);}catch(e){} }
function cacheState(){ try{ localStorage.setItem(CACHE_KEY,JSON.stringify(state)); }catch(e){} }
function status(msg,kind){ const el=$("status"); if(el){ el.textContent=msg||""; el.dataset.kind=kind||""; } }

/* 讀取：向 Apps Script 要清單，失敗就用本機快取，再不行用內建 SEED */
async function loadData(){
  status("讀取中…");
  try{
    const r=await fetch(API_URL,{cache:"no-store"});
    if(r.ok){ const d=await r.json(); if(Array.isArray(d)){ state=d; cacheState(); status(""); return; } }
  }catch(e){}
  try{ const c=localStorage.getItem(CACHE_KEY); if(c){ state=JSON.parse(c); status("顯示本機快取（未連上伺服器）","warn"); return; } }catch(e){}
  state=JSON.parse(JSON.stringify(SEED));
  status("尚未連上伺服器，顯示內建清單","warn");
}

/* 寫回：POST 給 Apps Script（用 text/plain 避開跨網域預檢） */
async function commit(){
  const pw=getPw();
  if(!pw){ status("沒有密碼，無法儲存","warn"); return false; }
  status("儲存中…");
  try{
    const r=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({password:pw, projects:state})
    });
    const res=await r.json();
    if(!res.ok) throw new Error(res.error||"儲存失敗");
    cacheState(); status("已儲存 ✓ 其他人重新整理即可看到","ok"); return true;
  }catch(e){
    status("儲存失敗："+e.message,"warn");
    if(String(e.message).includes("密碼")) setPw("");   // 密碼錯就清掉，下次重輸
    return false;
  }
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function paletteFor(i){return PALETTES[i%PALETTES.length];}

function render(){
  // tags
  const tags = ["全部", ...Array.from(new Set(state.map(p=>p.tag).filter(Boolean)))];
  filters.innerHTML = tags.map(t=>`<button class="chip ${t===activeTag?'active':''}" data-tag="${esc(t)}">${esc(t)}</button>`).join("");

  const filtered = state.map((p,i)=>({p,i})).filter(({p})=>{
    const okTag = activeTag==="全部" || p.tag===activeTag;
    const q=query.trim().toLowerCase();
    const okQ = !q || (p.title+p.desc+p.tag).toLowerCase().includes(q);
    return okTag && okQ;
  });

  let html = filtered.map(({p,i},n)=>{
    const [c1,c2]=paletteFor(i);
    const ph = `<div class="ph" style="background:linear-gradient(140deg,${c1},${c2})">${iconSVG(iconFor(p))}</div>`;
    const img = p.image ? `<img src="${esc(p.image)}" alt="" onerror="this.remove()">` : "";
    return `<article class="card" style="animation-delay:${n*0.05}s">
      <a class="cover" href="${esc(p.url||'#')}" target="_blank" rel="noopener"></a>
      <div class="editbar">
        <button class="iconbtn" data-edit="${i}" title="編輯">✎</button>
        <button class="iconbtn del" data-del="${i}" title="刪除">✕</button>
      </div>
      <div class="thumb"><span class="idx">${String(i+1).padStart(2,"0")}</span>${ph}${img}</div>
      <div class="body">
        ${p.tag?`<span class="tag">${esc(p.tag)}</span>`:""}
        <h3>${esc(p.title||"未命名")}</h3>
        <p>${esc(p.desc||"")}</p>
        <span class="go">前往專案 →</span>
      </div>
    </article>`;
  }).join("");

  html += `<div class="addcard" id="addCard"><span class="plus">+</span><span>新增專案</span></div>`;
  if(filtered.length===0 && !editing) html = `<div class="empty">找不到符合的專案</div>`+html;
  grid.innerHTML = html;
  $("count").textContent = `共 ${state.length} 個專案`;
}

/* events */
filters.addEventListener("click",e=>{const c=e.target.closest(".chip");if(c){activeTag=c.dataset.tag;render();}});
grid.addEventListener("click",async e=>{
  if(e.target.closest("#addCard")){openModal(null);return;}
  const ed=e.target.closest("[data-edit]"); if(ed){openModal(+ed.dataset.edit);return;}
  const dl=e.target.closest("[data-del]"); if(dl){
    const i=+dl.dataset.del;
    if(confirm(`刪除「${state[i].title}」？`)){state.splice(i,1);render();await commit();}
  }
});
$("search").addEventListener("input",e=>{query=e.target.value;render();});

/* 字體大小：標準 / 放大 / 特大，記住選擇 */
const FS_KEY="portal_fontsize";
function applyFont(v){
  document.documentElement.classList.remove("fs-l","fs-xl");
  if(v==="l") document.documentElement.classList.add("fs-l");
  if(v==="xl") document.documentElement.classList.add("fs-xl");
  document.querySelectorAll("#fontsw button").forEach(b=>b.classList.toggle("active",(b.dataset.fs||"")===(v||"")));
  try{ localStorage.setItem(FS_KEY,v||""); }catch(e){}
}
$("fontsw").addEventListener("click",e=>{const b=e.target.closest("button");if(b)applyFont(b.dataset.fs||"");});
try{ applyFont(localStorage.getItem(FS_KEY)||""); }catch(e){}
$("editToggle").addEventListener("click",()=>{
  if(!editing && !getPw()){
    const p=prompt("輸入編輯密碼（只會存在這台裝置）：");
    if(!p) return;
    setPw(p.trim());
  }
  editing=!editing;document.body.classList.toggle("editing",editing);
  $("editToggle").classList.toggle("active",editing);
  $("editToggle").textContent = editing?"✓ 完成編輯":"✎ 編輯模式";
  $("logoutBtn").style.display = editing?"inline-flex":"none";
});
$("logoutBtn").addEventListener("click",()=>{
  setPw(""); editing=false;
  document.body.classList.remove("editing");
  $("editToggle").classList.remove("active");
  $("editToggle").textContent="✎ 編輯模式";
  $("logoutBtn").style.display="none";
  status("已清除密碼","ok");
});

/* modal */
let pendingIcon="";
function buildIconPicker(){
  $("iconpick").innerHTML = ICON_ORDER.map(k=>`<button type="button" data-icon="${k}" title="${k}">${iconSVG(k)}</button>`).join("");
}
function highlightIcon(){
  document.querySelectorAll("#iconpick button").forEach(b=>b.classList.toggle("active",b.dataset.icon===pendingIcon));
}
buildIconPicker();
$("iconpick").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  pendingIcon=b.dataset.icon; highlightIcon();
});
function openModal(i){
  editIndex=i; pendingImg="";
  const p = i===null?{title:"",url:"",tag:"",desc:"",image:"",icon:""}:state[i];
  $("modalTitle").textContent = i===null?"新增專案":"編輯專案";
  $("f-title").value=p.title||""; $("f-url").value=p.url||"";
  $("f-tag").value=p.tag||""; $("f-desc").value=p.desc||"";
  $("f-img").value=p.image||""; pendingImg=p.image||"";
  pendingIcon = (p.icon && ICONS[p.icon]) ? p.icon : inferIcon(p);
  highlightIcon();
  updatePreview(pendingImg);
  overlay.classList.add("open");
}
function closeModal(){overlay.classList.remove("open");}
function updatePreview(src){const pv=$("preview");if(src){pv.src=src;pv.style.display="block";}else pv.style.display="none";}
$("f-img").addEventListener("input",e=>{pendingImg=e.target.value;updatePreview(pendingImg);});
$("uploadBtn").addEventListener("click",()=>$("imgFile").click());
$("imgFile").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{pendingImg=r.result;$("f-img").value="";updatePreview(pendingImg);};
  r.readAsDataURL(f);
});
$("saveBtn").addEventListener("click",async ()=>{
  const obj={
    title:$("f-title").value.trim(),
    url:$("f-url").value.trim(),
    tag:$("f-tag").value.trim(),
    desc:$("f-desc").value.trim(),
    image:pendingImg,
    icon:pendingIcon||""
  };
  if(!obj.title){alert("請至少填專案名稱");return;}
  if(editIndex===null) state.push(obj); else state[editIndex]=obj;
  closeModal();render();await commit();
});
$("cancelBtn").addEventListener("click",closeModal);
overlay.addEventListener("click",e=>{if(e.target===overlay)closeModal();});

/* export / import */
$("exportBtn").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="projects.json";a.click();
});
$("importBtn").addEventListener("click",()=>$("importFile").click());
$("importFile").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d)){state=d;cacheState();render();}}catch(err){alert("檔案格式不對");}};
  r.readAsText(f);
});

loadData().then(render);
</script>
</body>
</html>
